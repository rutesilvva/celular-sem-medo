appId: br.com.celularsemmedo.app
name: Participante conclui uma missão segura
tags:
  - smoke
  - participant
---
- launchApp:
    clearState: false
- assertVisible: "Seu progresso geral"
- tapOn: "Missões"
- assertVisible: "Escolha uma missão"
- tapOn:
    text: ".*Enviar uma foto.*"
- tapOn: "3 de 5"
- tapOn: "Começar treino"
- assertVisible: "Simulação segura"
- repeat:
    times: 3
    commands:
      - tapOn:
          text: "Continuar|Tocar no clipe|Flores"
          optional: true
- assertVisible: "Você conseguiu!"
- tapOn: "3 de 5"
- tapOn: "Registrar minha evolução"
- tapOn: "Continuar"
- assertVisible: "Meu progresso"
- tapOn: "Ver meu certificado"
- assertVisible: "Meu certificado"
