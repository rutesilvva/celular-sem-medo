name: Android E2E
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**','src/**','components/**','.maestro/**']
permissions:
  contents: read
jobs:
  presentation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_DEMO_MODE: 'true'
      EXPO_PUBLIC_ENABLE_DEVELOPMENT_MOCKS: 'false'
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && ./gradlew assembleDebug
      - run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            $HOME/.maestro/bin/maestro test .maestro/presentation-ci.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-visual-evidence
          path: ~/.maestro/tests/
          if-no-files-found: ignore
